<!doctype html><html><head><meta charset="utf-8"><style>
body{font:13px system-ui;margin:12px;width:320px;color:#222}h1{font-size:14px;margin:0 0 8px}
.n{font-weight:600}button{margin:6px 6px 0 0}#last{font-size:11px;color:#555;white-space:pre-wrap;word-break:break-all;max-height:120px;overflow:auto;background:#f4f4f4;padding:6px;border-radius:4px}
</style></head><body>
<h1>Sponsored post observer</h1>
<div>Captured in this browser: <span class="n" id="total">0</span></div>
<div>Sent to tracker: <span class="n" id="sent">0</span> &middot; waiting to send: <span class="n" id="buf">0</span></div>
<div>Last flush: <span id="flush">never</span></div>
<p>Run <code>python tracker.py fb-listen</code> to receive captures automatically, or export the buffer and run <code>python tracker.py fb-capture --file captures.json</code>.</p>
<button id="export">Export buffer (JSON)</button><button id="flushBtn">Send now</button><button id="clear">Clear buffer</button>
<h1 style="margin-top:10px">Last capture</h1><div id="last">-</div>
<script src="popup.js"></script></body></html>
